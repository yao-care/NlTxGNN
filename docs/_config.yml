# NlTxGNN - Netherlands Drug Repurposing Predictions

# Basic settings
title: "NlTxGNN - Geneesmiddelherpositionering"
description: "Voorspellingen voor herpositionering van door CBG-MEB goedgekeurde geneesmiddelen in Nederland, op basis van TxGNN"

author:
  name: 藥提醒科技有限公司 (yao.care)
  url: https://www.yao.care/
url: "https://nltxgnn.yao.care"
baseurl: ""
lang: "nl"

# Jekyll theme
remote_theme: just-the-docs/just-the-docs

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Search
search_enabled: true
search:
  heading_level: 3

# Footer
footer_content: "Copyright &copy; 2026 藥提醒科技有限公司 (yao.care). For research purposes only. Not medical advice."

# RSS Feed
feed:
  path: feed.xml
  posts_limit: 20

# Collections
collections:
  drugs:
    output: true
    permalink: /drugs/:name/
  news:
    output: true
    permalink: /news/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "drugs"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "news"
    values:
      layout: "default"

# Open Graph
og_image: "/assets/images/og-default.png"

# Twitter Card
twitter:
  card: summary_large_image

# SEO Tag defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.template"

